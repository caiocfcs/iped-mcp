[project]
name = "iped_mcp"
version = "0.1.0"
description = "MCP server para interagir com dados telemáticos indexados no IPED"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iped_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "runtime: smoke opcional GET-only contra WebAPI real via $IPED_URL (skip sem a variavel)",
    "characterization: pino do comportamento atual que M-2/M-8 trocarao deliberadamente",
]
